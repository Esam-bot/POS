services:
  postgres:
    image: postgres:16-alpine
    container_name: pos-postgres
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos_secret
      POSTGRES_DB: restaurant_pos
    ports:
      - "5432:5432"
    volumes:
      - pos_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d restaurant_pos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pos_pg_data:
